# Источник истины для Xcode-проекта. После изменений: `make ios` (xcodegen generate).
name: LevelUp

options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ru
  createIntermediateGroups: true

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  LevelUpKit:
    path: LevelUpKit
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "10.0.0"

targets:
  LevelUp:
    type: application
    platform: iOS
    sources:
      - path: LevelUp
      # Интенты, которые запускают приложение: их используют и Siri, и Пункт управления.
      - path: Shared
    dependencies:
      - package: LevelUpKit
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: LevelUpWidgets
    info:
      path: LevelUp/Info.plist
      properties:
        CFBundleDisplayName: Level Up
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [ru, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LUAPIBaseURL: $(API_BASE_URL)
        LUAppGroupID: $(APP_GROUP_ID)
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
          # Ссылки из виджетов: levelup://capture, levelup://journal/new …
          - CFBundleURLName: levelup
            CFBundleURLSchemes: [levelup]
        NSLocalNetworkUsageDescription: Level Up подключается к серверу разработки в локальной сети.
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы записывать задачи и мысли голосом.
        NSSpeechRecognitionUsageDescription: Распознавание речи превращает твой голос в текст записи.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "192.168.0.54":
              NSExceptionAllowsInsecureHTTPLoads: true
        # Live Activity тренировки: упражнение и таймер отдыха на экране блокировки.
        NSSupportsLiveActivities: true
    entitlements:
      path: LevelUp/LevelUp.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_NAME: LevelUp
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).levelup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}

  LevelUpWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LevelUpWidgets
      - path: Shared
    dependencies:
      - package: LevelUpKit
    info:
      path: LevelUpWidgets/Info.plist
      properties:
        CFBundleDisplayName: Level Up
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LUAPIBaseURL: $(API_BASE_URL)
        LUAppGroupID: $(APP_GROUP_ID)
        NSLocalNetworkUsageDescription: Level Up подключается к серверу разработки в локальной сети.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "192.168.0.54":
              NSExceptionAllowsInsecureHTTPLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LevelUpWidgets/LevelUpWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_NAME: LevelUpWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).levelup.widgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
