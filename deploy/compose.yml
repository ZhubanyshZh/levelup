# Сервер на VPS: Postgres + API + Caddy (HTTPS). Выкладывается командой `make deploy`.
# Секреты — в deploy/.env (создаёт `make server-env`, в git не попадает).
name: levelup-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: levelup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD в deploy/.env}
      POSTGRES_DB: levelup
    # Порт наружу не открыт: база доступна только API внутри Docker.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levelup -d levelup"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  api:
    build: ../backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://levelup:${POSTGRES_PASSWORD}@db:5432/levelup
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?нужен DOMAIN в deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Здесь сертификаты Let's Encrypt — не терять, иначе упрёмся в лимиты выдачи.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

  # Раз в сутки — дамп базы в /opt/levelup/backups, хранится 14 дней.
  # Скачать свежий на Mac: make server-backup HOST=root@…
  backup:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGUSER: levelup
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: levelup
    volumes:
      - ../backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -Fc -f /backups/levelup-$$(date +%F).dump && echo "backup ok"
          find /backups -name 'levelup-*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
